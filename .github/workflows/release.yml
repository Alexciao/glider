name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            .config/dotnet-tools.json

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Test
        run: dotnet test --project tests/Glider.Core.Tests -c Release

      - name: Build and package
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }} # FetchLegendary reads the fork's release in this private repo
        run: |
          $version = $env:REF_NAME.TrimStart("v")
          ./build/build.ps1 -Pack -Version $version
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Attach every Velopack output (Setup, full nupkg, Portable zip, releases.win.json, assets.win.json, RELEASES):
          # the update feed needs the complete set.
          $files = Get-ChildItem artifacts/releases -File | ForEach-Object FullName
          if (-not ($files | Where-Object { $_ -like '*releases.win.json' })) { throw 'releases.win.json missing' }
          $flags = @()
          if ($env:VERSION -match '-') { $flags += '--prerelease' }
          # Hand-written notes when docs/release-notes-<version>.md exists, GitHub's generated list otherwise.
          $notesFile = "docs/release-notes-v$env:VERSION.md"
          if (Test-Path $notesFile) { $flags += @('--notes-file', $notesFile) } else { $flags += '--generate-notes' }
          gh release create $env:REF_NAME @files --title "Glider $env:VERSION" --verify-tag @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
